[package]
name = "rofd-ffi"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable C ABI for the rofd OFD reader and renderer"

[lib]
name = "rofd_ffi"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
cairo-rs.workspace = true
rofd-core = { path = "../rofd-core" }
rofd-render = { path = "../rofd-render" }

[dev-dependencies]
zip.workspace = true

[[example]]
name = "abi-fixtures"
path = "tests/c/generate_fixtures.rs"
