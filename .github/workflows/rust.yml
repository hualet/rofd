name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libcairo2-dev
    - name: Format
      run: cargo fmt --all -- --check
    - name: Check legacy library
      run: cargo check --lib --tests
    - name: Test
      run: cargo test --lib --tests
