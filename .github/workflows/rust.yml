name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  core-and-render:
    name: Core and renderer
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Cairo development files
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Lint core and renderer
      run: cargo clippy -p rofd-core -p rofd-render --all-targets -- -D warnings
    - name: Test core and renderer
      run: cargo test -p rofd-core -p rofd-render
